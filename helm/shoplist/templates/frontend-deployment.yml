# frontend-deployment.yml - your turn (step 9c). Blank page
# Hint: copy stats-deployment.yml here and delete what you don't need
#
# stats-deployment.yml - your turn (step 9a). Same pattern as backend-deployment.yml
# stats has no Secret: it only talks to the backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend                # exactly the same label as above
    spec:
      containers:
        - name: frontend
          image: "{{.Values.frontend.image.repository}}:{{.Values.frontend.image.tag}}" 
          imagePullPolicy: {{.Values.imagePullPolicy}}
          ports:
            - containerPort: 80
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}

# Checklist:
#   [V] four levels: apiVersion, kind, metadata, spec
#   [V] app: frontend in two places, identical
#   [V] image: shoplist-frontend:local and imagePullPolicy: Never
#   [V] containerPort: 80
#   [V] no env, no Secret, no readinessProbe
#
# Before apply: kubectl apply --dry-run=server -f kubernetes/frontend-deployment.yml
